[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgrp"
version = "0.1.0"
description = "Evidence-grounded Android GUI task planning"
requires-python = ">=3.11"
dependencies = ["openai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mgrp = "mgrp.cli:main"
mgrp-quick = "mgrp.quick:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
